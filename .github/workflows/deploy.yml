name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli (Auto-detect version)
        run: |
          WASM_VERSION=$(grep -A 2 'name = "wasm-bindgen"' Cargo.lock | grep 'version' | head -n 1 | cut -d '"' -f 2)
          echo "Detected wasm-bindgen version: $WASM_VERSION"
          cargo install -f wasm-bindgen-cli --version "$WASM_VERSION"

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Generate JS glue
        run: wasm-bindgen target/wasm32-unknown-unknown/release/cube_3d.wasm --out-dir www/pkg --target web

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
