<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>3D Cube - 6 Photos</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		html,
		body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #000;
		}

		#canvas {
			position: fixed;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			display: block;
		}

		#loading {
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			color: #aaa;
			font-family: sans-serif;
			font-size: 18px;
			z-index: 10;
			pointer-events: none;
		}
	</style>
</head>

<body>
	<canvas id="canvas"></canvas>
	<div id="loading">加载中...</div>
	<script type="module">
		import init from './pkg/cube_3d.js';
		async function run() {
			await init();
			document.getElementById('loading').remove();
		}
		run();
	</script>
</body>

</html>
